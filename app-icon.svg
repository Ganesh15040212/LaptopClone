<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Laptop Screen Outer -->
  <rect x="106" y="128" width="300" height="190" rx="16" fill="#0f172a" stroke="#334155" stroke-width="8"/>
  <!-- Laptop Screen Inner -->
  <rect x="122" y="144" width="268" height="158" rx="8" fill="#1e293b"/>
  
  <!-- Transfer Waves / Arrows -->
  <path d="M 200 210 L 260 210 M 245 195 L 260 210 L 245 225" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 312 242 L 252 242 M 267 227 L 252 242 L 267 257" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Laptop Keyboard Base -->
  <path d="M 64 330 L 448 330 C 448 330 456 348 440 354 L 72 354 C 56 348 64 330 64 330 Z" fill="#cbd5e1"/>
  <!-- Trackpad Notch -->
  <rect x="226" y="332" width="60" height="10" rx="4" fill="#94a3b8"/>
